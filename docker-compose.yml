version: '3.9'

networks:
  trading_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
  clickhouse_data:
  arcadedb_data:
  valkey_data:
  qdrant_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:


services:
  # ==================== DATABASES ====================

  postgres:
    image: pgvector/pgvector:pg17
    container_name: trading-postgres
    hostname: postgres
    networks:
      - trading_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction123!}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user} -d trading" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: trading-clickhouse
    hostname: clickhouse
    networks:
      - trading_network
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    environment:
      CLICKHOUSE_DB: trading
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ChangeMeInProduction123!}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config:/etc/clickhouse-server/config.d
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
    restart: unless-stopped

  # Knowledge graph — Apache-2.0 ArcadeDB replaces GPL-3.0 Neo4j Community.
  # Supports Cypher, Gremlin, and SQL. Default port 2480 (HTTP), 2424 (binary).
  # Migration note: Python clients need updating (see arcadedb-python).
  arcadedb:
    image: arcadedata/arcadedb:24.11.1
    container_name: trading-arcadedb
    hostname: arcadedb
    networks:
      - trading_network
    ports:
      - "2480:2480" # HTTP/Studio UI
      - "2424:2424" # Binary protocol
    environment:
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:-ChangeMeInProduction123!}
        -Darcadedb.server.defaultDatabases=trading[root]
        -Darcadedb.server.mode=production
        -Xms4G -Xmx8G
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2480/api/v1/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 8G
    restart: unless-stopped

  # Cache + pub/sub — Valkey (BSD-3-Clause) replaces source-available Redis 7.4 (SSPL/RSALv2).
  # Wire-compatible drop-in for Redis clients. No application code changes needed.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: trading-valkey
    hostname: valkey
    networks:
      - trading_network
    ports:
      - "6379:6379"
    command: >
      valkey-server --requirepass ${VALKEY_PASSWORD:-ChangeMeInProduction123!} --maxmemory 8gb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: trading-qdrant
    hostname: qdrant
    networks:
      - trading_network
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped

  # ==================== EVENT BUS ====================

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: trading-kafka
    hostname: kafka
    networks:
      - trading_network
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: trading-schema-registry
    hostname: schema-registry
    networks:
      - trading_network
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ==================== MONITORING ====================

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: trading-prometheus
    hostname: prometheus
    networks:
      - trading_network
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  # Grafana pinned at 9.5.x — last Apache-2.0 release. 10.x moved to AGPL-3.0.
  # Future migration: Perses (Apache-2.0, CNCF) when its Prometheus + ClickHouse data
  # source maturity reaches feature parity with Grafana dashboards.
  grafana:
    image: grafana/grafana:9.5.21
    container_name: trading-grafana
    hostname: grafana
    networks:
      - trading_network
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Loki pinned at 2.9.x — last Apache-2.0 release. 3.x moved to AGPL-3.0.
  # Future migration: Vector (MPL-2.0) shipping logs into the existing ClickHouse
  # cluster removes the dedicated log store entirely.
  loki:
    image: grafana/loki:2.9.10
    container_name: trading-loki
    hostname: loki
    networks:
      - trading_network
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./infrastructure/loki/loki-config.yaml:/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Promtail pinned at 2.9.x — Apache-2.0. 3.x moved to AGPL-3.0.
  # Future migration: replace with Vector (MPL-2.0).
  promtail:
    image: grafana/promtail:2.9.10
    container_name: trading-promtail
    hostname: promtail
    networks:
      - trading_network
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # ==================== AUTHENTICATION ====================

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: trading-keycloak
    hostname: keycloak
    networks:
      - trading_network
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-trading_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction123!}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==================== KAFKA TOOLS (Optional) ====================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: trading-kafka-ui
    hostname: kafka-ui
    networks:
      - trading_network
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: trading-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== INIT CONTAINERS ====================

  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: trading-kafka-init
    networks:
      - trading_network
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/scripts/create-topics.sh
    entrypoint: [ "/bin/bash", "/scripts/create-topics.sh" ]
    restart: "no"
  # ==================== PROFILES FOR OPTIONAL SERVICES ====================

  # Uncomment services below or use profiles: docker-compose --profile ml up

  # ml-service:
  #   profiles: ["ml"]
