

networks:
  trading_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16

services:
  # --- Event Bus ---
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    networks:
      - trading_network
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Transactional DB ---
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    networks:
      - trading_network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Time-Series DB ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    networks:
      - trading_network
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # --- Cache ---
  redis:
    image: redis:7.4-alpine
    container_name: redis
    networks:
      - trading_network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Vector DB ---
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant
    networks:
      - trading_network
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # --- Graph DB ---
  neo4j:
    image: neo4j:5.25-community
    container_name: neo4j
    networks:
      - trading_network
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data

  # --- Identity Provider ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    networks:
      - trading_network
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    command: start-dev

  # --- Observability ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - trading_network
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - trading_network
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  # --- Microservices ---
  trading-engine:
    build: ./services/trading-engine
    container_name: trading-engine
    networks:
      - trading_network
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  market-data:
    build: ./services/market-data
    container_name: market-data
    networks:
      - trading_network
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  ai-assistant:
    build: ./services/ai-assistant
    container_name: ai-assistant
    networks:
      - trading_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - kafka
      - qdrant
      - neo4j
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  backtesting-engine:
    build: ./services/backtesting-engine
    container_name: backtesting-engine
    networks:
      - trading_network
    depends_on:
      - clickhouse


volumes:
  postgres_data:
  clickhouse_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  prometheus_data:
  grafana_data:
