# Prometheus Configuration
# Agentic AI Algorithmic Trading System v5.0

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "trading-system"
    environment: "development"

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Databases
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          database: "trading"
          role: "transactional"

  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          database: "trading"
          role: "analytics"

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          database: "trading"
          role: "cache"

  # Event Bus
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:9092"]
        labels:
          component: "event-bus"

  # Monitoring Stack
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

