# Prometheus Configuration
# Agentic AI Algorithmic Trading System v5.0

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "trading-system"
    environment: "development"

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Rule files
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Databases
  # PostgreSQL does not expose Prometheus metrics on 5432; scrape the
  # postgres-exporter sidecar (see docker-compose) on 9187 instead.
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          database: "trading"
          role: "transactional"

  # ClickHouse exposes Prometheus-format metrics on its HTTP port at /metrics.
  - job_name: "clickhouse"
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:8123"]
        labels:
          database: "trading"
          role: "analytics"

  # Valkey does not expose Prometheus metrics on 6379; scrape the
  # redis-exporter sidecar (wire-compatible with Valkey) on 9121.
  - job_name: "valkey"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          database: "trading"
          role: "cache"

  # Event Bus — Confluent cp-kafka does not expose Prometheus metrics on 9092.
  # To collect Kafka metrics, add a JMX exporter sidecar and target it, e.g.
  # bitnami/jmx-exporter on kafka-jmx-exporter:9404.
  # - job_name: "kafka"
  #   static_configs:
  #     - targets: ["kafka-jmx-exporter:9404"]
  #       labels:
  #         component: "event-bus"

  # Monitoring Stack
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

