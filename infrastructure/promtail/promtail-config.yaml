# Promtail config for grafana/promtail:2.9.x (Apache-2.0).
# docker-compose mounts the host docker container JSON-log directory read-only
# (/var/lib/docker/containers), so we scrape those files rather than using
# docker_sd_configs (no docker socket is mounted). Each container's log line is
# a JSON object {"log","stream","time"}; the pipeline extracts the inner line
# and labels it by stream (stdout/stderr). Replaces an empty directory.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
      - labels:
          stream:
      - output:
          source: output

  # Optional: host syslog/application files under /var/log.
  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
