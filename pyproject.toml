[tool.poetry]
name = "trading-system-libs"
version = "1.0.0"
description = "Shared libraries for Agentic AI Algorithmic Trading System v5.0"
authors = ["Trading System Team"]
readme = "README.md"
packages = [{include = "libs"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core dependencies
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

# Web framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.25.0"}

# Database - PostgreSQL
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"

# Database - ClickHouse
clickhouse-driver = "^0.2.6"
clickhouse-connect = "^0.6.23"

# Database - Neo4j
neo4j = "^5.16.0"

# Database - Redis
redis = "^5.0.1"
hiredis = "^2.3.2"

# Database - Qdrant
qdrant-client = "^1.7.0"

# Messaging - Kafka
kafka-python = "^2.0.2"
confluent-kafka = {extras = ["avro"], version = "^2.3.0"}
avro = "^1.11.3"

# Monitoring
prometheus-client = "^0.19.0"

# Logging
structlog = "^24.1.0"
python-json-logger = "^2.0.7"

# Authentication
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
cryptography = "^41.0.7"
python-keycloak = "^3.9.0"

# Utilities
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
tenacity = "^8.2.3"

# Testing
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
pytest-mock = "^3.12.0"
faker = "^22.0.0"

[tool.poetry.group.dev.dependencies]
black = "^23.12.1"
isort = "^5.13.2"
mypy = "^1.8.0"
pylint = "^3.0.3"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=libs --cov-report=html --cov-report=term-missing"
