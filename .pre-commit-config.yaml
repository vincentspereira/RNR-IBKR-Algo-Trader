# Pre-commit hooks for RNR-IBKR-Algo-Trader
# Run: pre-commit install
# Use: pre-commit run --all-files

repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^(tests/.*|libs/quant/.*)
      - id: end-of-file-fixer
        name: End of file fixer
        exclude: ^(tests/.*|libs/quant/.*)
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: debug-statements
        name: Check for debug statements
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-docstring-first
        name: Check docstring is first
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']

  # Strip Jupyter notebook outputs (keeps research notebook diffs clean)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        name: Strip notebook outputs
        files: \.ipynb$

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Format Python code (Black)
        language_version: python3.12
        args: ['--line-length=100', '--target-version=py312']

  # Import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        args: ['--profile=black', '--line-length=100']

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: Type check (mypy)
        language_version: python3.12
        args:
          - '--python-version=3.12'
          - '--warn-return-any'
          - '--warn-unused-configs'
          - '--disallow-untyped-defs'
          - '--ignore-missing-imports'
        additional_dependencies:
          - pydantic>=2.5.0
          - types-requests
          - types-PyYAML
        exclude: ^(tests/|core_trading/|services/)

  # Security checks with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: Security check (bandit)
        args: ['-f', 'json', '-o', 'bandit-report.json']
        exclude: ^tests/

  # Linting with pylint
  - repo: local
    hooks:
      - id: pylint
        name: Lint Python code (pylint)
        entry: pylint
        language: system
        args:
          - '--disable=C0103,C0114,C0115,C0116,C0301'  # Disable: invalid-name, missing-docstring, line-too-long
          - '--max-line-length=100'
          - '--output-format=text'
        types: [python]
        exclude: ^tests/

      - id: no-stubs
        name: Enforce no-stubs / no-damaged-code policy
        entry: python tools/check_no_stubs.py
        language: system
        pass_filenames: true
        types: [file]
        exclude: ^\.archive/

  # Python code quality with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python code (flake8)
        args:
          - '--max-line-length=100'
          - '--ignore=E203,W503,E501'  # Conflicts with black
          - '--exclude=.git,__pycache__,docs,venv,env,.venv,build,dist'
        additional_dependencies:
          - flake8-docstrings
        exclude: ^(tests/|core_trading/)

  # Check for common security issues
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets in code
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(package-lock.json|poetry.lock|pnpm-lock.yaml|requirements.txt)

    # Duplicate Code Detection
  - repo: https://github.com/kucherenko/jscpd
    rev: v3.5.3
    hooks:
      - id: jscpd
        name: Detect duplicate code (jscpd)
        description: Find duplicate code blocks
        entry: jscpd
        language: system
        types: [python]
        args:
          - "--format"
          - "json"
          - "--min-lines"
          - "5"
          - "--reporters"
          - "json"
          - "--threshold"
          - "1"
          - "--ignore"
          - "**/__pycache__/**,**/tests/**,**/node_modules/**"

# Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        args: ['--ignore', 'DL3008', '--ignore', 'DL3009']

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        name: Lint shell scripts
        args: ['--severity=warning']

  # JSON and YAML sorting/formatting
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.12.0
    hooks:
      - id: pretty-format-json
        args: ['--autofix', '--indent=2', '--no-sort-keys']
      - id: pretty-format-yaml
        args: ['--autofix', '--indent=2']

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args:
          - '--disable=MD013,MD033,MD041'
          - '--fix'
        exclude: '^(node_modules/|\.venv/|venv/)'

  # Check for TODO/FIXME comments
  - repo: https://github.com/digitalpulp/pre-commit-php
    rev: 1.4.0
    hooks:
      - id: php-no-xdebug
        name: Check for xdebug usage
        files: \.php$

  # General file checks
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.4
    hooks:
      - id: forbid-tabs
        name: Forbid tabs
        exclude: ^(Makefile|*.mk|.*\.go)

  # Yaml formatting
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.12.0
    hooks:
      - id: pretty-format-yaml
        args: ['--autofix', '--indent=2', '--width=100']
